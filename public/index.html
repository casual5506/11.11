<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빼빼로 상자</title>
<meta property="og:title" content="너에게 온 빼빼로 상자">
<meta property="og:description" content="좋아하는 빼빼로를 골라봐. 상자가 만들어줄게.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 휴대폰 한 화면. 구멍 세 개 상자 → 재료 5가지를 하나씩 고르기(고를 때마다 한마디) → 상자에서 빼빼로 11개가 쏟아짐 */
:root{
  color-scheme: light;
  --milk:#FFF1F4;        /* 바탕: 딸기우유 */
  --paper:#FFFDF9;       /* 카드 */
  --berry:#FF9DB6;       /* 주 강조: 딸기 */
  --berry-deep:#F07A9A;
  --butter:#FFE49C;      /* 상자 */
  --butter-deep:#F7CF6B;
  --mint:#BDEBD8;
  --lilac:#DCCFF7;
  --ink:#5B3F43;         /* 글자: 코코아 */
  --ink-soft:#9A7C80;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--milk);
  background-image:
    radial-gradient(circle at 12% 18%, #FFE1E9 0 70px, transparent 71px),
    radial-gradient(circle at 88% 30%, #E9F8F0 0 90px, transparent 91px),
    radial-gradient(circle at 20% 88%, #FFF3CC 0 80px, transparent 81px),
    radial-gradient(circle at 85% 85%, #EDE5FB 0 60px, transparent 61px);
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
  display:flex;justify-content:center;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:18px}
.stage{display:none;flex:1;min-height:0;flex-direction:column;gap:14px;animation:rise .45s ease-out}
.stage.active{display:flex}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.25}
h1{font-size:32px}
h2{font-size:25px}
.sub{color:var(--ink-soft);font-size:16px}
.head{text-align:center;display:flex;flex-direction:column;gap:4px}

.btn{
  font-family:var(--display);font-size:21px;color:#fff;background:var(--berry-deep);
  border:0;border-radius:999px;padding:15px 24px;width:100%;min-height:56px;flex:none;
  box-shadow:0 6px 0 #D9617F;cursor:pointer;transition:transform .08s, box-shadow .08s, opacity .2s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #D9617F}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--paper);color:var(--berry-deep);box-shadow:0 6px 0 #FFD0DB}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* 구멍 세 개 상자 */
.mbox{position:relative;width:220px;height:128px;flex:none;background-color:var(--butter);border-radius:16px 16px 24px 24px;
  background-image:radial-gradient(circle,#FFF3C4 3px,transparent 4px);background-size:22px 22px;
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.06);transform:rotate(-2deg)}
.mbox::before{content:"";position:absolute;left:-8px;right:-8px;top:-10px;height:30px;background:var(--butter-deep);border-radius:14px}
.mbox::after{content:"";position:absolute;left:12px;right:12px;bottom:-18px;height:12px;border-radius:50%;background:rgba(91,63,67,.09)}
.mbox .trim{position:absolute;left:-8px;right:-8px;top:19px;height:12px;background:radial-gradient(circle at 10px 0,var(--butter-deep) 9px,transparent 10px) 0 0/20px 12px repeat-x}
.mbox .holes{position:absolute;left:0;right:0;top:58px;display:flex;justify-content:center;gap:20px}
.mbox .hole{width:42px;height:42px;border-radius:50%;background:var(--ink);border:4px solid #FFF7D9;box-shadow:inset 0 6px 0 rgba(0,0,0,.28)}
.mbox .knot{position:absolute;left:50%;top:-36px;width:0;height:0}
.mbox .knot::before,.mbox .knot::after{content:"";position:absolute;top:0;width:40px;height:30px;background:var(--berry)}
.mbox .knot::before{right:3px;border-radius:60% 35% 35% 60%;transform:rotate(-14deg)}
.mbox .knot::after{left:3px;border-radius:35% 60% 60% 35%;transform:rotate(14deg)}
.mbox .knot i{position:absolute;left:-10px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--berry-deep);z-index:1}
.mbox .tag{position:absolute;right:-30px;top:30px;background:var(--paper);color:var(--berry-deep);font-family:var(--display);font-size:15px;line-height:1;padding:6px 10px;border-radius:10px;transform:rotate(14deg);box-shadow:0 3px 0 #FFDCE5}
.mbox .st{position:absolute;color:#fff;line-height:1}
.mbox .st.a{left:14px;bottom:14px;font-size:18px}
.mbox .st.b{right:16px;bottom:18px;font-size:14px}
.scene{position:relative;padding:64px 56px 40px}
.spark{position:absolute;line-height:1;animation:twinkle 1.9s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.45}50%{transform:scale(1.1);opacity:1}}
.shrink{height:124px;display:flex;align-items:flex-end;justify-content:center;flex:none}
.shrink>div{transform:scale(.68);transform-origin:50% 100%}

/* 편지 봉투 */
.env{position:relative;display:block;width:var(--e);height:calc(var(--e)*.66);background:#FFE6EC;border:0;padding:0;border-radius:calc(var(--e)*.07);box-shadow:0 calc(var(--e)*.035) 0 #F3B9C6;perspective:700px}
.env::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(to top right,#FFD6DF 49.5%,transparent 50%) left/50% 100% no-repeat,linear-gradient(to top left,#FFD6DF 49.5%,transparent 50%) right/50% 100% no-repeat}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#FFB9CA;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .7s ease;z-index:2}
.env .seal{position:absolute;left:50%;top:52%;width:calc(var(--e)*.24);height:calc(var(--e)*.24);margin:calc(var(--e)*-.12) 0 0 calc(var(--e)*-.12);border-radius:50%;background:#fff;color:var(--berry-deep);font-size:calc(var(--e)*.13);display:flex;align-items:center;justify-content:center;z-index:3;transition:opacity .3s}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{opacity:0}
button.env{cursor:pointer;position:absolute;z-index:6}
button.env.wig{animation:envwig 1.2s ease-in-out infinite}
@keyframes envwig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-4px)}}
.envwrap{flex:1;display:flex;align-items:center;justify-content:center}
#s3 .scroll{display:none}
#s3.read .scroll{display:flex}
#s3.read .envwrap{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column;gap:18px;padding-bottom:10px}
.letter{background:var(--paper);border-radius:28px;padding:24px 22px;box-shadow:0 8px 0 #FFDCE5;display:flex;flex-direction:column;gap:12px;flex:none;
  background-image:repeating-linear-gradient(transparent 0 33px,#FFE7EC 33px 34px);animation:unfold .6s cubic-bezier(.3,1.3,.5,1)}
@keyframes unfold{from{transform:translateY(70px) scale(.85)}to{transform:none}}
.letter p{font-size:17px;line-height:34px;-webkit-user-select:text;user-select:text}
.letter .to{font-family:var(--display);font-size:22px;color:var(--berry-deep)}
.letter .from{text-align:right;font-family:var(--display);font-size:19px}
.letter{position:relative}
.letter .to{padding-right:56px}
.letter .corner{position:absolute;top:-22px;right:22px;transform:rotate(28deg)}
.letter .lfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.letter .deco{position:relative;width:96px;height:92px;flex:none}
.letter .deco .pp{position:absolute;left:42px;top:0}
#s3 .scroll{padding-top:28px}
.mbox.idle{animation:wiggle 2.6s ease-in-out infinite}
.mbox.shake{animation:shake .28s linear infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(1deg)}}
@keyframes shake{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(2deg) translateY(-5px)}}

/* 1. 표지 */
.cover{justify-content:space-between}
.boxwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}

/* 빼빼로 부품 */
.pp{position:relative;width:var(--w);height:calc(var(--w)*7.5);border-radius:calc(var(--w)*.55);flex:none}
.pp .coat{position:absolute;left:calc(var(--w)*-.12);right:calc(var(--w)*-.12);top:0;height:76%;border-radius:calc(var(--w)*.68);overflow:hidden}
.pp .coat.ghost{background:rgba(91,63,67,.08)}
.pp .coat b{position:absolute;display:block}
.pp .driz{position:absolute;inset:0}
.pp .bow{position:absolute;left:50%;top:84%;width:0;height:0}
.pp .bow::before,.pp .bow::after{content:"";position:absolute;top:calc(var(--w)*-.5);width:calc(var(--w)*.95);height:calc(var(--w)*1);background:var(--rb);border-radius:45% 45% 45% 45%}
.pp .bow::before{right:calc(var(--w)*.08);transform:rotate(-20deg);border-radius:60% 30% 30% 60%}
.pp .bow::after{left:calc(var(--w)*.08);transform:rotate(20deg);border-radius:30% 60% 60% 30%}
.pp .bow i{position:absolute;left:calc(var(--w)*-.26);top:calc(var(--w)*-.26);width:calc(var(--w)*.52);height:calc(var(--w)*.52);border-radius:50%;background:var(--rb);filter:brightness(.9);z-index:1}

/* 2. 만들기 */
.slots{display:flex;gap:8px;justify-content:space-between;flex:none}
.slot{flex:1;min-width:0;border:3px solid transparent;background:var(--paper);border-radius:22px;padding:10px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--body);font-size:14px;color:var(--ink-soft);cursor:pointer}
.slot .pic{height:92px;display:flex;align-items:center;justify-content:center}
.slot .q{width:34px;height:34px;border-radius:50%;border:3px dashed #F3C6D1;color:#F3C6D1;font-family:var(--display);font-size:18px;display:flex;align-items:center;justify-content:center}
.slot.cur{border-color:var(--berry-deep);color:var(--ink);background:#FFF}
.slot:disabled{opacity:.55}
.panel{flex:1;min-height:0;overflow-y:auto;background:var(--paper);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 #FFDCE5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-family:var(--body);font-size:16px;color:var(--ink);background:#FFF;border:3px solid #FFE0E8;
  border-radius:999px;padding:8px 14px;min-height:48px;display:flex;align-items:center;gap:8px;cursor:pointer
}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);flex:none;border:2px solid rgba(91,63,67,.12)}
.chip[aria-pressed="true"]{border-color:var(--berry-deep);background:#FFF0F4}
.talk{display:flex;gap:10px;align-items:flex-start;margin-top:auto}
.talk .me{flex:none;width:44px;height:44px;border-radius:50%;background:var(--lilac);font-family:var(--display);font-size:15px;display:flex;align-items:center;justify-content:center}
.talk .bubble{background:var(--mint);border-radius:6px 22px 22px 22px;padding:11px 15px;font-size:16px;line-height:1.5;min-height:46px}
.talk .bubble.pop{animation:bub .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes bub{from{transform:scale(.85)}to{transform:none}}

/* 대화창 */
.slot{cursor:default;padding:8px 2px 5px}
.slot .pic{height:80px}
.chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border-radius:28px;padding:16px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 #FFDCE5}
.chat>:first-child{margin-top:auto}
.msg{display:flex;gap:8px;max-width:88%;flex:none;animation:bub .3s cubic-bezier(.3,1.6,.5,1)}
.msg .who{font-size:13px;color:var(--ink-soft);line-height:1.2;margin-bottom:4px}
.msg .b{padding:10px 14px;font-size:16px;line-height:1.45;display:inline-flex;align-items:center;gap:8px}
.msg .b i{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none;border:2px solid rgba(91,63,67,.12)}
.msg.him{align-self:flex-start;transform-origin:0 100%}
.msg.him .face{flex:none;width:40px;height:40px;border-radius:16px;background:var(--lilac);font-family:var(--display);font-size:17px;display:flex;align-items:center;justify-content:center}
.msg.him .b{background:var(--mint);border-radius:6px 20px 20px 20px}
.msg.her{align-self:flex-end;text-align:right;transform-origin:100% 100%}
.msg.her .b{background:var(--butter);border-radius:20px 6px 20px 20px;text-align:left}
.reply{flex:none;min-height:116px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:flex-end}
.reply .chip{animation:bub .25s ease-out}
@media (prefers-reduced-motion: reduce){ .msg,.reply .chip{animation:none} }

/* 문구 바꾸기 */
.row2{display:flex;gap:10px;flex:none}
.row2 .btn{font-size:18px;padding:12px 8px;flex:1 1 0;width:auto;min-width:0}
.guide{text-align:center;font-size:14px}
.linkbox{flex:none;background:#FFF8DD;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px}
.linkbox[hidden]{display:none}
.linkbox label{font-size:15px}
.linkbox textarea{font-family:var(--body);font-size:14px;line-height:1.4;color:var(--ink);background:#fff;border:3px solid #F7E2A0;border-radius:14px;padding:8px 10px;width:100%;resize:none;word-break:break-all;-webkit-user-select:text;user-select:text}
.textbtn{flex:none;align-self:center;background:none;border:0;font-family:var(--body);font-size:14px;color:var(--ink-soft);text-decoration:underline;padding:4px 10px;cursor:pointer}
.edit{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px;padding-bottom:10px}
.card{background:var(--paper);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 #FFDCE5;flex:none}
.card.key{background:#FFF8DD;box-shadow:0 6px 0 #F7E2A0}
.card h3{font-family:var(--display);font-weight:400;font-size:20px}
.card .note{font-size:14px;color:var(--ink-soft);margin-top:-8px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:15px;display:flex;align-items:center;gap:7px}
.fld label i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;border:2px solid rgba(91,63,67,.12)}
.fld input,.fld textarea{font-family:var(--body);font-size:16px;line-height:1.5;color:var(--ink);background:#fff;border:3px solid #FFE0E8;border-radius:16px;padding:10px 12px;width:100%;resize:vertical;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--berry-deep)}
.fld input::placeholder,.fld textarea::placeholder{color:#C9B3B6;opacity:1}

/* 3. 쏟아지기 */
#s2{overflow-y:auto}
.pourtop{display:flex;justify-content:center;padding-top:14px;flex:none}
.pile{position:relative;flex:1;min-height:130px}
.pile .pp{position:absolute;z-index:3}
.result{background:var(--paper);border-radius:28px;padding:18px 20px;box-shadow:0 8px 0 #FFDCE5;display:flex;flex-direction:column;gap:8px;flex:none;visibility:hidden}
.result.on{visibility:visible;animation:rise .4s ease-out}
.result .recipe{font-family:var(--display);font-size:18px;color:var(--berry-deep);line-height:1.4}
.result p{font-size:16px;-webkit-user-select:text;user-select:text}
.result .hint{font-size:14px;color:var(--ink-soft)}
@media (prefers-reduced-motion: reduce){
  .stage,.mbox.idle,.mbox.shake,.talk .bubble.pop,.result.on,.spark,.letter,button.env.wig{animation:none}
  .env .flap{transition:none}
}
</style>
</head>
<body>
<main class="app">

  <!-- 1. 표지 -->
  <section class="stage cover active" id="s0">
    <div class="head">
      <p class="sub">11월 11일</p>
      <h1>너에게 온 상자</h1>
    </div>
    <div class="boxwrap">
      <div class="scene">
        <span class="spark" style="left:18px;top:34px;font-size:26px;color:#F07A9A">✦</span>
        <span class="spark" style="right:14px;top:10px;font-size:20px;color:#B79CF0;animation-delay:.6s">✦</span>
        <span class="spark" style="right:6px;bottom:52px;font-size:16px;color:#7FD3B4;animation-delay:1.1s">✦</span>
        <span class="spark" style="left:8px;bottom:26px;font-size:18px;color:#F7CF6B;animation-delay:.3s">♥</span>
        <div class="mbox idle"></div>
      </div>
    </div>
    <button class="btn" id="startBtn">열어보기</button>
    <button class="btn ghost" id="shareTopBtn" style="margin-top:6px">공유하기</button>
  </section>

  <!-- 2. 만들기 -->
  <section class="stage" id="s1">
    <div class="slots" id="slots"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="reply" id="reply"></div>
  </section>

  <!-- 3. 쏟아지기 -->
  <section class="stage" id="s2">
    <div class="head"><h2 id="pourTitle"></h2></div>
    <div class="shrink"><div><div class="mbox" id="pourBox"></div></div></div>
    <div class="pile" id="pile"></div>
    <div class="result" id="result">
      <div class="recipe" id="recipe"></div>
      <p id="envHint"></p>
    </div>
  </section>

  <!-- 4. 편지 -->
  <section class="stage" id="s3">
    <div class="envwrap"><div class="env" id="bigEnv" style="--e:240px"><span class="flap"></span><span class="seal">♥</span></div></div>
    <div class="scroll">
      <div class="letter">
        <div class="corner" id="corner" aria-hidden="true"></div>
        <p class="to" id="toLine"></p>
        <div id="letterBody"></div>
        <div class="lfoot">
          <div class="deco" id="deco" aria-hidden="true"></div>
          <p class="from" id="fromLine"></p>
        </div>
      </div>
      <div class="row2">
        <button class="btn ghost" id="againBtn">다시 만들기</button>
        <button class="btn" id="shareBtn">공유하기</button>
      </div>
      <p class="sub guide">공유하기를 누르면 이름, 한마디, 편지를 내 이야기로 바꿔서 나만의 링크를 만들 수 있어요.</p>
    </div>
  </section>

  <!-- 5. 문구 바꾸기 (공유하기) -->
  <section class="stage" id="s4">
    <div class="head">
      <h2>문구 바꾸기</h2>
      <p class="sub">흐린 글씨는 예시예요. 칸을 눌러 바로 적으면 돼요</p>
    </div>
    <div class="edit" id="edit"></div>
    <div class="linkbox" id="linkBox" hidden>
      <label for="linkOut" id="linkNote">이 링크를 보내면 바꾼 문구로 열려요.</label>
      <textarea id="linkOut" rows="2" readonly></textarea>
      <div class="row2">
        <button class="btn ghost" id="copyBtn">링크 복사</button>
        <button class="btn" id="sendBtn">보내기</button>
      </div>
    </div>
    <button class="textbtn" id="resetBtn">적은 내용 모두 지우기</button>
    <div class="row2">
      <button class="btn ghost" id="applyBtn">미리 해보기</button>
      <button class="btn" id="linkBtn">링크 만들기</button>
    </div>
  </section>
</main>

<script>
/* ===== 여기만 바꾸면 내용이 바뀝니다. say 가 선택지를 골랐을 때 나오는 한마디 ===== */
const CONFIG = {
  me: "나",
  her: "너",
  hello: "지금부터 물어보는 거에 하나씩 답해줘!",
  last: "좋아, 다 골랐다. 이제 상자에 넣을게!",
  count: 11,
  pourTitle: "짠! 네가 고른 빼빼로 11개",
  envHint: "어? 편지도 같이 나왔네. 봉투를 눌러서 열어봐.",
  letter: {
    to: "세상에서 제일 귀여운 너에게",
    body: [
      "네가 고른 빼빼로, 하나하나 다 기억해둘게.",

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stages = [$("s0"), $("s1"), $("s2"), $("s3"), $("s4")];
document.querySelectorAll(".mbox").forEach(b=>{
  b.innerHTML = '<span class="knot"><i></i></span><span class="trim"></span>'
    + '<div class="holes"><span class="hole"></span><span class="hole"></span><span class="hole"></span></div>'
    + '<span class="tag">11.11</span><span class="st a">♥</span><span class="st b">✦</span>';
});
const show = n => stages.forEach((s,i)=>s.classList.toggle("active", i===n));
const P = CONFIG.parts;
const sel = {};          // key -> option index
let step = 0;
const opt = key => { const p = P.find(p=>p.key===key); return sel[key]==null ? null : p.options[sel[key]]; };

/* 빼빼로 그리기. only 가 있으면 그 부품만 따로 그린다 */
const SPOTS = [[18,6],[58,13],[30,21],[66,29],[14,37],[50,44],[70,53],[24,59],[56,67],[16,76],[62,83],[36,91]];
function makePP(w, only){
  const want = k => !only || only===k;
  const pp = document.createElement("div");
  pp.className = "pp"; pp.style.setProperty("--w", w+"px");
  const stick = opt("stick"), coat = opt("coat"), top = opt("top"), driz = opt("driz"), rib = opt("ribbon");
  if(want("stick") && stick) pp.style.background = stick.c;
  if(want("coat") || want("top") || want("driz")){
    const c = document.createElement("div"); c.className = "coat";
    if(want("coat") && coat) c.style.background = coat.c; else c.classList.add("ghost");
    if(want("driz") && driz && driz.c){
      const d = document.createElement("div"); d.className = "driz";
      const a = w*.55, b = w*.8;
      d.style.background = "repeating-linear-gradient(118deg, transparent 0 "+a+"px, "+driz.c+" "+a+"px "+b+"px)";
      c.appendChild(d);
    }
    if(want("top") && top && top.kind!=="none"){
      const k = w/22;
      SPOTS.forEach(([x,y],i)=>{
        const b = document.createElement("b");
        b.style.left = x+"%"; b.style.top = y+"%";
        if(top.kind==="sprinkle"){
          b.style.width = 4*k+"px"; b.style.height = 10*k+"px"; b.style.borderRadius = 4*k+"px";
          b.style.background = ["#FFE49C","#BDEBD8","#DCCFF7","#FFFFFF","#FFC1D0"][i%5];
          b.style.transform = "rotate("+(i*47%180)+"deg)";
        }else if(top.kind==="almond"){
          b.style.width = 7*k+"px"; b.style.height = 9*k+"px"; b.style.borderRadius = "50%";
          b.style.background = "#F3D9B1"; b.style.transform = "rotate("+(i*31%90)+"deg)";
        }else if(top.kind==="crunch"){
          b.style.width = 7*k+"px"; b.style.height = 6*k+"px"; b.style.borderRadius = 2*k+"px";
          b.style.background = i%2 ? "#4A302A" : "#D9B38A"; b.style.transform = "rotate("+(i*53%90)+"deg)";
        }else{
          b.textContent = "♥"; b.style.fontSize = 10*k+"px"; b.style.lineHeight = "1"; b.style.color = "#FF6F93";
          b.style.textShadow = "0 0 "+2*k+"px #fff";
        }
        c.appendChild(b);
      });
    }
    pp.appendChild(c);
  }
  if(want("ribbon") && rib){
    const bow = document.createElement("div"); bow.className = "bow"; bow.style.setProperty("--rb", rib.c);
    bow.appendChild(document.createElement("i")); pp.appendChild(bow);
  }
  return pp;
}

/* 2. 만들기 화면 */
function renderSlots(){
  const box = $("slots"); box.innerHTML = "";
  P.forEach((p,i)=>{
    const b = document.createElement("div");
    b.className = "slot" + (i===step ? " cur" : "");
    const pic = document.createElement("div"); pic.className = "pic";
    if(sel[p.key]!=null) pic.appendChild(makePP(12, p.key));
    else { const q = document.createElement("span"); q.className = "q"; q.textContent = "?"; pic.appendChild(q); }
    b.append(pic, document.createTextNode(p.name));
    box.appendChild(b);
  });
}
/* 카톡처럼 쌓이는 대화: 왼쪽은 질문과 한마디, 오른쪽은 고른 답 */
let run = 0;
function addMsg(who, text, color){
  const chat = $("chat"), m = document.createElement("div");
  m.className = "msg " + who;
  const col = document.createElement("div");
  const name = document.createElement("div"); name.className = "who";
  name.textContent = who==="him" ? CONFIG.me : CONFIG.her;
  const b = document.createElement("div"); b.className = "b";
  if(color){ const dot = document.createElement("i"); dot.style.setProperty("--c", color); b.appendChild(dot); }
  b.appendChild(document.createTextNode(text));
  col.append(name, b);
  if(who==="him"){ const f = document.createElement("div"); f.className = "face"; f.textContent = CONFIG.me.slice(0,1); m.appendChild(f); }
  m.appendChild(col);
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
}
function ask(){
  const p = P[step], reply = $("reply");
  renderSlots();
  addMsg("him", p.q);
  reply.innerHTML = "";
  p.options.forEach((o,i)=>{
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip";
    if(o.c){ const dot = document.createElement("i"); dot.style.setProperty("--c", o.c); c.appendChild(dot); }
    c.appendChild(document.createTextNode(o.name));
    c.addEventListener("click", ()=>choose(i));
    reply.appendChild(c);
  });
}
function choose(i){
  const p = P[step], o = p.options[i], my = run;
  sel[p.key] = i;
  $("reply").innerHTML = "";
  addMsg("her", o.name, o.c);
  step++; renderSlots();
  setTimeout(()=>{
    if(my!==run) return;
    addMsg("him", o.say);
    setTimeout(()=>{
      if(my!==run) return;
      if(step < P.length){ ask(); return; }
      addMsg("him", CONFIG.last);
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn"; b.textContent = "상자에 넣기";
      b.addEventListener("click", pour);
      $("reply").appendChild(b);
    }, 900);
  }, 550);
}
$("startBtn").addEventListener("click", ()=>{
  run++; step = 0; P.forEach(p=>delete sel[p.key]);
  $("chat").innerHTML = ""; $("reply").innerHTML = "";
  show(1);
  addMsg("him", CONFIG.hello);
  const my = run;
  setTimeout(()=>{ if(my===run) ask(); }, 700);
});

/* 3. 상자에서 쏟아지기 */
function pour(){
  show(2);
  const pile = $("pile"), box = $("pourBox"), res = $("result");
  pile.innerHTML = ""; res.classList.remove("on");
  $("recipe").textContent = P.map(p=>opt(p.key).name + (p.key==="stick"||p.key==="ribbon" ? " "+p.name : "")).join(" · ");
  $("envHint").textContent = CONFIG.envHint;
  const done = ()=>{
    box.classList.remove("shake");
    $("pourTitle").textContent = CONFIG.pourTitle;
    res.classList.add("on");
    /* 마지막으로 편지 봉투가 가운데 구멍에서 떨어진다 */
    const E = 96, env = document.createElement("button");
    env.type = "button"; env.className = "env"; env.style.setProperty("--e", E+"px");
    env.setAttribute("aria-label", "편지 열기");
    env.innerHTML = '<span class="flap"></span><span class="seal">♥</span>';
    const pr = pile.getBoundingClientRect();
    env.style.left = (pr.width/2 - E/2) + "px"; env.style.bottom = "6px";
    env.addEventListener("click", openLetter);
    pile.appendChild(env);
    if(reduce || !env.animate){ env.classList.add("wig"); return; }
    const h = box.querySelectorAll(".hole")[1].getBoundingClientRect();
    const dy = (h.top + h.height/2 - pr.top) - (pr.height - 6 - E*.33);
    env.animate([
      { transform:"translateY("+dy+"px) scale(.15)", easing:"ease-in" },
      { transform:"translateY(0) scale(1)", offset:.8, easing:"ease-out" },
      { transform:"translateY(-10px)", offset:.9, easing:"ease-in" },
      { transform:"translateY(0)" }
    ], { duration:900 }).onfinish = ()=>env.classList.add("wig");
  };
  $("pourTitle").textContent = "덜컹덜컹… 상자가 만드는 중";
  if(!reduce) box.classList.add("shake");
  setTimeout(()=>{
    const pr = pile.getBoundingClientRect();
    const holes = [...box.querySelectorAll(".hole")].map(h=>{ const r = h.getBoundingClientRect(); return [r.left+r.width/2-pr.left, r.top+r.height/2-pr.top]; });
    const W = 13, H = W*7.5, gap = 150, dur = 1100;
    for(let i=0;i<CONFIG.count;i++){
      const el = makePP(W);
      const x = pr.width*(.14 + .72*((i*7)%CONFIG.count)/(CONFIG.count-1));
      const bottom = -40 + Math.random()*48;
      const ang = (i%2 ? -1 : 1)*(60 + Math.random()*28);
      el.style.left = (x - W/2) + "px"; el.style.bottom = bottom + "px";
      el.style.transform = "rotate("+ang+"deg)";
      pile.appendChild(el);
      if(reduce || !el.animate) continue;
      const [hx,hy] = holes[i%3];
      const dx = hx - x, dy = hy - (pr.height - bottom - H/2);
      el.animate([
        { transform:"translate("+dx+"px,"+dy+"px) rotate(0deg) scale(.15)", easing:"ease-in" },
        { transform:"translate("+dx*.45+"px,"+dy*.5+"px) rotate("+ang*.45+"deg) scale(1)", offset:.4, easing:"ease-in" },
        { transform:"translate(0,0) rotate("+ang+"deg)", offset:.84, easing:"ease-out" },
        { transform:"translate(0,-9px) rotate("+ang+"deg)", offset:.92, easing:"ease-in" },
        { transform:"translate(0,0) rotate("+ang+"deg)" }
      ], { duration:dur, delay:i*gap, fill:"backwards" });
    }
    setTimeout(done, reduce ? 0 : (CONFIG.count-1)*gap + dur + 150);
  }, reduce ? 0 : 1100);
}

}
renderLetter();
function openLetter(){
  const s3 = $("s3"), env = $("bigEnv");

/* 5. 문구 바꾸기: [제목] 아래 [적는 칸]. 재료 종류는 고정이고 한마디만 바꾼다 */
const KEY = "pepero-texts-v1";
function groups(){
  const g = [
    { title:"이름", note:"대화창 말풍선 위에 나오는 두 사람 이름이에요.", key:true, items:[
      { id:"f-me",  label:"내 이름 (왼쪽 말풍선)",   get:()=>CONFIG.me,  set:v=>CONFIG.me=v },
      { id:"f-her", label:"상대 이름 (오른쪽 말풍선)", get:()=>CONFIG.her, set:v=>CONFIG.her=v } ]},
    { title:"편지 받는 사람 · 보내는 사람", note:"편지 맨 위와 맨 아래에 들어가요.", key:true, items:[
      { id:"f-to",   label:"받는 사람", get:()=>CONFIG.letter.to,   set:v=>CONFIG.letter.to=v },
      { id:"f-from", label:"보내는 사람", get:()=>CONFIG.letter.from, set:v=>CONFIG.letter.from=v } ]},
    { title:"편지 본문", note:"줄을 바꾸면 문단이 나뉘어요.", items:[
      { id:"f-body", label:"본문", rows:9, get:()=>CONFIG.letter.body.join("\n"),
        set:v=>CONFIG.letter.body=v.split(/\n+/).map(x=>x.trim()).filter(Boolean) } ]},
    { title:"대화 시작과 끝", items:[
      { id:"f-hello", label:"첫 마디", rows:2, get:()=>CONFIG.hello, set:v=>CONFIG.hello=v },
      { id:"f-last",  label:"다 고른 뒤 마무리 말", rows:2, get:()=>CONFIG.last, set:v=>CONFIG.last=v } ]}
  ];
  P.forEach(p=>g.push({ title:p.name+" 한마디", note:"질문 “"+p.q+"”에 상대가 답하면 나오는 말이에요.",
    items:p.options.map((o,i)=>({ id:"f-"+p.key+"-"+i, label:o.name, color:o.c, rows:2, get:()=>o.say, set:v=>o.say=v })) }));
  g.push({ title:"결과 화면", items:[
    { id:"f-pour", label:"빼빼로가 쏟아진 뒤 제목", rows:2, get:()=>CONFIG.pourTitle, set:v=>CONFIG.pourTitle=v },
    { id:"f-env",  label:"편지 봉투 안내", rows:2, get:()=>CONFIG.envHint, set:v=>CONFIG.envHint=v } ]});
  return g;
}
const allItems = ()=>groups().flatMap(g=>g.items);
const DEF = {}; allItems().forEach(f=>DEF[f.id] = f.get());
function setAll(map){ allItems().forEach(f=>{ const v = map[f.id]; if(typeof v==="string" && v.trim()) f.set(v.trim()); }); }
/* own: 이 브라우저에서 직접 적은 문구만 모아 둔다. 적지 않은 칸은 예시 문구가 쓰인다 */
let own = {};
function loadOwn(){
  try{
    const saved = JSON.parse(localStorage.getItem(KEY) || "null") || {};
    Object.keys(DEF).forEach(k=>{ if(typeof saved[k]==="string" && saved[k].trim() && saved[k]!==DEF[k]) own[k] = saved[k].trim(); });
  }catch(e){}
}
function applyOwn(){ const all = {}; Object.keys(DEF).forEach(k=>all[k] = own[k] || DEF[k]); setAll(all); }
loadOwn();
/* 링크에 담긴 문구: ?d=... (z=압축, j=그대로) */
function b64u(bytes){ let t = ""; for(let i=0;i<bytes.length;i++) t += String.fromCharCode(bytes[i]); return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ const t = atob(str.replace(/-/g,"+").replace(/_/g,"/")); const b = new Uint8Array(t.length); for(let i=0;i<t.length;i++) b[i] = t.charCodeAt(i); return b; }
async function pack(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    try{ const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer(); return "z" + b64u(new Uint8Array(buf)); }catch(e){}
  }
  return "j" + b64u(raw);
}
async function unpack(str){
  let raw = unb64u(str.slice(1));
  if(str[0]==="z") raw = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(raw));
}
const params = new URLSearchParams(location.search);
const shared = params.get("d") || (location.hash.match(/d=([\w-]+)/) || [])[1];
const sharedId = /^[a-z0-9]{12}$/.test(params.get("k") || "") ? params.get("k") : "";
function useShared(m){ const safe = {}; Object.keys(m || {}).forEach(k=>{ if(typeof m[k]==="string") safe[k] = m[k].slice(0, 3000); }); setAll(safe); renderLetter(); }
if(shared){
  unpack(shared).then(useShared).catch(()=>{});
}else if(sharedId){
  /* 문구를 받아올 때까지 시작 버튼을 잠깐 막는다 (최대 5초) */
  const start = $("startBtn"); start.disabled = true;
  const open = ()=>{ start.disabled = false; };
  const timer = setTimeout(open, 5000);
  fetch("api/get?id=" + sharedId).then(r=>r.ok ? r.json() : null).then(m=>{ if(m) useShared(m); }).catch(()=>{}).then(()=>{ clearTimeout(timer); open(); });
}else{
  applyOwn();
}
renderLetter();
function openEditor(){
  const box = $("edit"); box.innerHTML = "";
  groups().forEach(g=>{
    const card = document.createElement("div"); card.className = "card" + (g.key ? " key" : "");
    const h = document.createElement("h3"); h.textContent = g.title; card.appendChild(h);
    if(g.note){ const n = document.createElement("p"); n.className = "note"; n.textContent = g.note; card.appendChild(n); }
    g.items.forEach(f=>{
      const w = document.createElement("div"); w.className = "fld";
      const l = document.createElement("label"); l.htmlFor = f.id;
      if(f.color){ const dot = document.createElement("i"); dot.style.setProperty("--c", f.color); l.appendChild(dot); }
      l.appendChild(document.createTextNode(f.label));
      const el = document.createElement(f.rows ? "textarea" : "input");
      el.id = f.id; if(f.rows) el.rows = f.rows; else el.type = "text";
      el.value = own[f.id] || ""; el.placeholder = DEF[f.id]; el.autocomplete = "off";
      w.append(l, el); card.appendChild(w);
    });
    box.appendChild(card);
  });
  box.scrollTop = 0;
  $("linkBox").hidden = true;
  show(4);
}
function collect(){
  allItems().forEach(f=>{
    const el = $(f.id); if(!el) return;
    const v = el.value.trim();
    if(v && v!==DEF[f.id]) own[f.id] = v; else delete own[f.id];
  });
  applyOwn();
  try{ localStorage.setItem(KEY, JSON.stringify(own)); }catch(e){}
  renderLetter();
  return own;
}
let linkUrl = "";
$("linkBtn").addEventListener("click", async ()=>{
  const diff = Object.assign({}, collect());
  /* 바꾼 문구는 서버에 저장하고, 링크에는 12자 번호만 넣는다. 저장이 안 되면 문구를 주소에 담은 긴 링크로 대신한다 */
  const base = location.origin + location.pathname;
  let note = "이 링크를 보내면 바꾼 문구로 열려요. 문구는 1년 동안 보관돼요.";
  $("linkBtn").disabled = true;
  if(!Object.keys(diff).length){
    linkUrl = base; note = "바꾼 문구가 없어서 기본 링크예요.";
  }else{
    try{
      const r = await fetch("api/save", { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(diff) });
      const j = await r.json();
      if(!r.ok || !/^[a-z0-9]{12}$/.test(j.id || "")) throw new Error("save");
      linkUrl = base + "?k=" + j.id;
    }catch(e){
      linkUrl = base + "?d=" + await pack(diff);
      note = "짧은 링크를 만들지 못해서 긴 링크로 만들었어요. 이 링크도 그대로 열려요.";
    }
  }
  $("linkBtn").disabled = false;
  $("linkNote").textContent = note;
  $("linkOut").value = linkUrl;
  $("copyBtn").textContent = "링크 복사";
  $("sendBtn").hidden = !navigator.share;
  $("linkBox").hidden = false;
});
$("copyBtn").addEventListener("click", ()=>{
  const ok = ()=>{ $("copyBtn").textContent = "복사했어요"; };
  const manual = ()=>{ $("linkOut").focus(); $("linkOut").select(); $("copyBtn").textContent = "길게 눌러 복사"; };
  try{ navigator.clipboard.writeText(linkUrl).then(ok, manual); }catch(e){ manual(); }
});
$("sendBtn").addEventListener("click", ()=>{
  try{ navigator.share({ title: document.title, url: linkUrl }).catch(()=>{}); }catch(e){}
});
$("shareBtn").addEventListener("click", openEditor);
$("shareTopBtn").addEventListener("click", openEditor);
$("applyBtn").addEventListener("click", ()=>{
  collect();
  run++; P.forEach(p=>delete sel[p.key]); step = 0; show(0);
});
$("resetBtn").addEventListener("click", ()=>{
  own = {}; setAll(DEF); renderLetter();
  try{ localStorage.removeItem(KEY); }catch(e){}
  openEditor();
});
</script>
</body>
